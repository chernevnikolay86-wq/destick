name: "🐛 Bug report"
description: A crash, broken UI, or anything that isn't a site-specific report.
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Load the extension unpacked
        2. Open ...
        3. Click the toolbar icon
        4. See ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Destick version
      placeholder: 0.1.0 (see chrome://extensions)
  - type: input
    id: browser
    attributes:
      label: Browser & OS
      placeholder: Chrome 140 on macOS 14
  - type: textarea
    id: console
    attributes:
      label: Console errors (if any)
      render: shell
