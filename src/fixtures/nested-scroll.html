<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Fixture: nested-scroll</title>
    <link rel="stylesheet" href="_common.css" />
    <style>
      #panel { height: 300px; overflow: hidden; border: 2px solid #ccc; padding: 12px; }
      #panel .inner { height: 1200px; background: linear-gradient(#fff, #fdd); }
      #toolbar { position: sticky; top: 0; z-index: 30; background: #113; color: #fff; padding: 10px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Article</h1>
      <a id="target-link" href="#end">Jump to end</a>
      <p>F13 — nested scroll container with its own overflow:hidden → LIMITATION: only document-root locks are unlocked; the nested one is not (deferred).</p>
      <div id="toolbar">sticky toolbar</div>
      <div id="panel"><div class="inner">nested content (locked container)</div></div>
      <div class="tall"></div>
      <p id="end">The end.</p>
    </main>
  </body>
</html>
