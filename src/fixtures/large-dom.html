<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Fixture: large-dom</title>
    <link rel="stylesheet" href="_common.css" />
    <style>
      #bar { position: fixed; top: 0; left: 0; right: 0; z-index: 900; background: #222; color: #fff; padding: 10px; }
      .cell { display: inline-block; width: 40px; height: 18px; margin: 1px; background: #eef; }
    </style>
  </head>
  <body>
    <div id="bar">sticky bar over a large DOM</div>
    <main>
      <h1>Large DOM</h1>
      <a id="target-link" href="#end">Jump to end</a>
      <p>F17 — ~10,000 nodes → performance baseline (AC-A9).</p>
      <div id="grid"></div>
      <p id="end">The end.</p>
    </main>
    <script>
      const grid = document.getElementById('grid');
      const frag = document.createDocumentFragment();
      for (let i = 0; i < 10000; i++) {
        const d = document.createElement('span');
        d.className = 'cell';
        frag.appendChild(d);
      }
      grid.appendChild(frag);
    </script>
  </body>
</html>
