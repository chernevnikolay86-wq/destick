<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Fixture: svg-overlay</title>
    <link rel="stylesheet" href="_common.css" />
    <style>
      #svg { position: fixed; top: 0; left: 0; right: 0; z-index: 900; }
    </style>
  </head>
  <body>
    <main>
      <h1>Article</h1>
      <a id="target-link" href="#end">Jump to end</a>
      <p>HIGH5 — a fixed SVG overlay with inline display:block!important; the inline-important
        fallback must cover SVGElement, not just HTMLElement.</p>
      <div class="tall"></div>
      <p id="end">The end.</p>
    </main>
    <svg id="svg" width="100%" height="60" style="display:block !important">
      <rect width="100%" height="60" fill="#b33" />
    </svg>
  </body>
</html>
